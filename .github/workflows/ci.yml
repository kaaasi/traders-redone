name: CI
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  CI_OUT: ci-out
jobs:
  # Same-repository branches already receive push CI; PR merge tests are useful
  # only after main changed. Keep PR CI to validate that synthetic merge as well.
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/tools -v
      - run: python3 tools/check-architecture.py
      - run: bash -n tools/ci-step.sh tools/ci-wait.sh tools/ci-publish.sh
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet --info
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props', 'global.json') }}
      - name: Verify originals
        run: |
          bash tools/ci-step.sh hash-dos bash -c 'cd original/dos && sha256sum -c ../SHA256SUMS.dos'
          bash tools/ci-step.sh hash-amiga bash -c 'cd original/amiga && sha256sum -c ../SHA256SUMS.amiga'
      - run: bash tools/ci-step.sh build dotnet build TradersRedone.slnx -c Release
      - run: bash tools/ci-step.sh test dotnet test TradersRedone.slnx -c Release --no-build --logger "trx;LogFileName=linux.trx" --results-directory "$CI_OUT/tests"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-results
          path: ci-out
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-win-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props', 'global.json') }}
      - run: bash tools/ci-step.sh build dotnet build TradersRedone.slnx -c Release
      - run: bash tools/ci-step.sh test dotnet test TradersRedone.slnx -c Release --no-build --logger "trx;LogFileName=windows.trx" --results-directory "$CI_OUT/tests"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-results
          path: ci-out
          retention-days: 7
  report:
    needs: [linux, windows, policy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-results'
          path: results
      - name: Build compact report
        env:
          REPORT_SHA: ${{ github.sha }}
          REPORT_REF: ${{ github.ref_name }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: python3 tools/ci-report.py results report "$REPORT_SHA" "$REPORT_REF" "linux=$LINUX_RESULT" "windows=$WINDOWS_RESULT" "policy=$POLICY_RESULT"
      - uses: actions/upload-artifact@v5
        with:
          name: compact-report
          path: report
          retention-days: 7
