name: CI

# Results of every run (summary, full logs, test results, screenshots, experiment output)
# are pushed to the branch "ci-results" so they can be read with plain git.

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  CI_OUT: ci-out

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-linux-

      - name: Verify original file hashes
        run: |
          tools/ci-step.sh hash-dos bash -c 'cd original/dos && sha256sum -c ../SHA256SUMS.dos'
          tools/ci-step.sh hash-amiga bash -c 'cd original/amiga && sha256sum -c ../SHA256SUMS.amiga'

      - name: Build
        run: tools/ci-step.sh build dotnet build TradersRedone.slnx -c Release

      - name: Test
        run: tools/ci-step.sh test dotnet test TradersRedone.slnx -c Release --no-build --logger "trx;LogFileName=linux.trx" --results-directory "$CI_OUT/tests"

      - name: Export assets
        if: success() || failure()
        run: tools/ci-step.sh export dotnet run --project src/Traders.Tools -c Release --no-build -- export original/dos "$CI_OUT/images/assets"

      - name: Viewer screenshots (virtual display)
        if: success() || failure()
        run: tools/ci-step.sh viewer-screenshots xvfb-run -a -s "-screen 0 1280x1024x24" dotnet run --project src/Traders.Viewer -c Release --no-build -- original/dos --screenshot "$CI_OUT/images/viewer"

      - name: Experiment (ci/experiment.sh, if present)
        if: (success() || failure()) && hashFiles('ci/experiment.sh') != ''
        run: |
          mkdir -p "$CI_OUT/experiment"
          tools/ci-step.sh experiment bash ci/experiment.sh "$CI_OUT/experiment"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-results
          path: ci-out
          include-hidden-files: true

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-win-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-win-

      - name: Build
        run: tools/ci-step.sh build dotnet build TradersRedone.slnx -c Release

      - name: Test
        run: tools/ci-step.sh test dotnet test TradersRedone.slnx -c Release --no-build --logger "trx;LogFileName=windows.trx" --results-directory "$CI_OUT/tests"

      - name: Publish viewer (win-x64, self-contained)
        if: success() || failure()
        run: tools/ci-step.sh publish-viewer dotnet publish src/Traders.Viewer/Traders.Viewer.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/traders-viewer-win-x64

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-results
          path: ci-out
          include-hidden-files: true

      - name: Download for the user (Actions page → artifact "traders-viewer-win-x64")
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: traders-viewer-win-x64
          path: out/traders-viewer-win-x64

  report:
    needs: [ linux, windows ]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ci-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: '*-results'
          path: results

      - name: Build report
        run: python3 tools/ci-report.py results report "${{ github.sha }}" "${{ github.ref_name }}" "linux=${{ needs.linux.result }}" "windows=${{ needs.windows.result }}"

      - name: Publish to branch ci-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/ci-publish.sh report "${{ github.sha }}" "${{ github.ref_name }}"
