name: Build

# Saves Actions minutes (GitHub Free, modelled on the Eishockey-Manager): pure documentation changes do not build, draft PRs
# build only on "Ready for review", a new push cancels the outdated run of the same PR. Windows build and downloads only by
# hand ("Run workflow", user decision 10.11.2026). No tags (the release tag claude-werkzeuge of werkzeuge.yml is the only
# exception, AGENTS.md section 6).
#
# Path filter: the last matching pattern wins. docs/routines/** and STATUS.md are inputs of tools/abdeckung.py --check and
# therefore always build, although they are documentation.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/routines/**'
      - 'STATUS.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/routines/**'
      - 'STATUS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Read-only fine-grained token for the private repo kaaasi/traders-referenz (original files). Without the secret the
      # run is limited to the tests without original data and says so in the summary.
      HAS_REFERENZ_TOKEN: ${{ secrets.TRADERS_REFERENZ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Original files from kaaasi/traders-referenz
        if: env.HAS_REFERENZ_TOKEN == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: kaaasi/traders-referenz
          token: ${{ secrets.TRADERS_REFERENZ_TOKEN }}
          path: .referenz
          sparse-checkout: original
          persist-credentials: false
      - name: Link gamedata/
        if: env.HAS_REFERENZ_TOKEN == 'true'
        run: ln -sfn "$PWD/.referenz/original" gamedata
      # Exactly the SDK from global.json, as in the Claude session (release claude-werkzeuge). global-json-file would
      # install the latest patch, and the runner image ships newer patches that rollForward latestPatch would pick, so
      # the SDK goes into its own folder that contains nothing else.
      - name: SDK version from global.json
        id: sdk
        run: echo "version=$(jq -r .sdk.version global.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Check SDK version
        run: test "$(dotnet --version)" = "${{ steps.sdk.outputs.version }}" || { echo "dotnet $(dotnet --version) instead of ${{ steps.sdk.outputs.version }}" >&2; exit 1; }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/packages.lock.json', 'global.json') }}
      # The same check as locally; the table goes into the run summary.
      # Full check (three test runs) with original data; without them only the run without data.
      - name: tools/pruefen.sh
        run: |
          set -o pipefail
          if [ -f gamedata/dos/T.EXE ]; then bash tools/pruefen.sh | tee pruefen.txt
          else bash tools/pruefen.sh --schnell | tee pruefen.txt; fi
      - name: Zusammenfassung
        if: success() || failure()
        run: if [ -f pruefen.txt ]; then sed -n '/^### Markerbericht/,$p' pruefen.txt >> "$GITHUB_STEP_SUMMARY"; fi

  # By hand only: Windows build and tests.
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore TradersRedone.slnx --locked-mode
      - run: dotnet build TradersRedone.slnx -c Release --no-restore -warnaserror
      - run: dotnet test TradersRedone.slnx -c Release --no-build

  # By hand only: runnable viewer for download (Actions -> run -> Artifacts), short retention.
  downloads:
    if: github.event_name == 'workflow_dispatch'
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet publish src/Traders.Viewer/Traders.Viewer.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/traders-viewer-${{ matrix.rid }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: traders-viewer-${{ matrix.rid }}-${{ github.sha }}
          path: out/traders-viewer-${{ matrix.rid }}
          retention-days: 7
