name: Publish CI report
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'dev/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      # Trusted default-branch code only; never execute downloaded report contents.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: compact-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate provenance and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPORT_REF: ${{ github.event.workflow_run.head_branch }}
          REPORT_RUN_ID: ${{ github.event.workflow_run.id }}
          REPORT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 tools/validate-report.py report
          bash tools/ci-publish.sh report "$REPORT_SHA" "$REPORT_REF"
